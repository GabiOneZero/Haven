<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event.target)">
    <ion-refresher-content
      pullingText="Desliza para actualizar"
      refreshingSpinner="crescent"
      style="--ion-color-step-200: var(--haven-background); --ion-color-step-250: var(--haven-background)"
    />
  </ion-refresher>
  <app-header [title]="'Buenos días'" />
  <div class="px-3.5 flex flex-col gap-4">
    <app-day-schedule-card
      [date]="getFormattedDate()"
      [events]="events"
      [loading]="scheduleLoading()"
      [connected]="calendarConnected()"
      [reauthorizationRequired]="calendarNeedsReauthorization()"
      [connectionMessage]="calendarMessage()"
      [error]="scheduleError()"
      [currentUserName]="currentUserName()"
    />
    @if (moodsLoading()) {
    <p role="status">Cargando moods...</p>
    } @else if (moodsError()) {
    <p role="alert">{{ moodsError() }}</p>
    } @else if (moods(); as currentMoods) {
    <app-mood-card [firstMood]="currentMoods[0]" [secondMood]="currentMoods[1]" />
    }
    <div class="flex flex-col gap-4">
      <app-daily-question-card />
      <app-shopping-card />
      <app-decision-card />
    </div>
  </div>
</ion-content>
