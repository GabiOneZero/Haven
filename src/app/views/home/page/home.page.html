<app-header [title]="'Inicio'" />

<ion-content>
  <div class="home-container">
    <app-day-schedule-card [weekDay]="getWeekDay()" [date]="getFormattedDate()" [events]="events" />

    <div class="moods-row">
      @for (mood of moods; track mood.id) {
        <app-mood-card [moodData]="mood" />
      }
    </div>

    <app-daily-question-card />
    <app-shopping-card />
    <app-decision-card />
  </div>
</ion-content>
