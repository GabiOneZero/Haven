<ion-card class="question-card">
  <ion-card-content class="question-content">
    <div class="question-icon">
      <app-home-icon [paths]="homeIconPaths.sparkle" strokeColor="#171716" />
    </div>
    <div class="question-text">
      <span class="question-label">Pregunta diaria</span>
      <p class="question-body">¿Qué pequeño momento de esta semana te ha hecho feliz?</p>
    </div>
    <div class="question-arrow">
      <app-home-icon [paths]="homeIconPaths.arrowRight" strokeColor="#171716" />
    </div>
  </ion-card-content>
</ion-card>
