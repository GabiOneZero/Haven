<app-home-feature-card accentColor="var(--haven-question-accent)">
  <div class="question-content">
    <div class="question-heading">
      <span class="question-label">Pregunta del día</span>
      <app-tag
        label="Ambos respondieron"
        backgroundColor="var(--haven-question-status-bg)"
        textColor="var(--haven-question-status-text)"
      />
    </div>
    <p class="question-body">«¿Qué pequeño momento de esta semana te ha hecho feliz?»</p>
    <div class="question-action">
      <span>Responder</span>
      <app-icon name="arrow-right" aria-hidden="true" />
    </div>
  </div>
</app-home-feature-card>
