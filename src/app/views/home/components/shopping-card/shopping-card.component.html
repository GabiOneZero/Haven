<app-home-feature-card
  accentColor="var(--haven-shopping-accent)"
  [routerLink]="['/tabs/organize']"
  [queryParams]="{ list: 'shopping' }"
  role="link"
  aria-label="Abrir la lista de la compra"
>
  <div class="shopping-content">
    <div class="shopping-icon" aria-hidden="true">
      <app-icon name="cart" />
    </div>
    <div class="shopping-copy">
      <h2 class="shopping-title">Lista de la compra</h2>
      <p class="shopping-summary">
        @if (summaryLoading()) {
          Cargando compra...
        } @else if (pendingCount() === 1) {
          1 producto pendiente
        } @else {
          {{ pendingCount() }} productos pendientes
        }
      </p>
    </div>
    <div class="shopping-action">
      <span>Abrir</span>
      <app-icon name="arrow-right" aria-hidden="true" />
    </div>
  </div>
</app-home-feature-card>
