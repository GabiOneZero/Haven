<div class="mood-card" [style.background-color]="moodData.bgColor">
  <div class="mood-decoration" aria-hidden="true"></div>
  <div class="mood-content">
    <p class="mood-name" [style.color]="moodData.moodColor">{{ moodData.initials }}</p>
    <p class="mood-state" [style.color]="moodData.moodColor">{{ moodData.mood }}</p>
  </div>
</div>
