<div class="mood-card" [style.background-color]="moodData.bgColor">
  <div class="mood-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
  </div>
  <div class="mood-content">
    <p class="mood-name">{{ moodData.name }}</p>
    <p class="mood-state">{{ moodData.mood }}</p>
  </div>
</div>
