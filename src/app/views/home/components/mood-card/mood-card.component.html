<div class="relative flex flex-col gap-2 rounded-3xl border border-(--haven-card-border) bg-[#262625] p-3">
  <div class="grid h-7 grid-cols-[1fr_auto_1fr] items-center gap-1.5">
    <app-tag [label]="firstMood.name" [backgroundColor]="firstMood.moodColor" textColor="#201f1e" />
    <div class="whitespace-nowrap text-center text-sm font-semibold leading-5 text-[#f5f4f1]">¿Cómo te sientes?</div>
    <app-tag
      class="ml-auto"
      [label]="secondMood.name"
      [backgroundColor]="secondMood.moodColor"
      textColor="#201f1e"
    />
  </div>
  <div class="grid grid-cols-2 gap-3">
    <app-mood-card-part
      class="block min-w-0"
      [backgroundColor]="firstMood.bgColor"
      [textColor]="firstMood.moodColor"
      [state]="firstMood.mood"
    />
    <app-mood-card-part
      class="block min-w-0"
      [backgroundColor]="secondMood.bgColor"
      [textColor]="secondMood.moodColor"
      [state]="secondMood.mood"
    />
  </div>
  @if (showMoodsHeart) {
    <app-icon
      class="absolute left-1/2 top-[calc(50%+0.5rem)] z-10 h-5 w-5 -translate-x-1/2 -translate-y-1/2 text-white"
      name="us"
      [filled]="true"
      aria-hidden="true"
    />
  }
</div>
