<div class="moods-row">
  <app-mood-card-part
    class="mood-card-1"
    [backgroundColor]="firstMood.bgColor"
    [textColor]="firstMood.moodColor"
    [state]="firstMood.mood"
    [initials]="firstMood.initials"
  />
  <app-mood-card-part
    class="mood-card-2"
    [backgroundColor]="secondMood.bgColor"
    [textColor]="secondMood.moodColor"
    [state]="secondMood.mood"
    [initials]="secondMood.initials"
  />
  @if (showMoodsHeart) {
    <app-icon class="moods-heart" name="us" [filled]="true" aria-hidden="true" />
  }
</div>
