<div
  class="flex min-h-14 min-w-0 items-center justify-center gap-1.5 rounded-[1.1rem] border-2 px-2 text-white"
  [style.background-color]="backgroundColor"
  [style.border-color]="textColor"
>
  @if (state.toLowerCase().includes('energ')) {
    <svg
      class="h-5 w-5 shrink-0"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      [style.color]="textColor"
      aria-hidden="true"
    >
      <path d="M13 2 3 14h7l-1 8 12-14h-7l-1-6Z" />
    </svg>
  } @else if (state.toLowerCase().includes('calm')) {
    <svg
      class="h-5 w-5 shrink-0"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      [style.color]="textColor"
      aria-hidden="true"
    >
      <path d="M12 22a8 8 0 0 0 8-8c0-4-8-12-8-12S4 10 4 14a8 8 0 0 0 8 8Z" />
    </svg>
  }
  <p class="m-0 min-w-0 whitespace-nowrap text-[0.9375rem] font-semibold leading-5">{{ state }}</p>
</div>
