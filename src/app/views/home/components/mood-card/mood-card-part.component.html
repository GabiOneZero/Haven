<div class="mood-card" [style.background-color]="backgroundColor">
  <div class="mood-decoration" aria-hidden="true"></div>
  <div class="mood-content">
    <p class="mood-name" [style.color]="textColor">{{ initials }}</p>
    <p class="mood-state" [style.color]="textColor">{{ state }}</p>
  </div>
</div>
