<div
  class="flex w-full flex-col gap-4 px-3.5 pb-4"
  aria-busy="true"
  aria-label="Cargando inicio"
>
  <header
    class="flex items-center justify-between pt-[calc(1rem_+_var(--safe-area-inset-top,env(safe-area-inset-top,0px)))]"
  >
    <span class="h-7 w-36 animate-pulse rounded-full bg-[#3d3d3a]"></span>
    <div class="flex items-center gap-2">
      <span class="h-10 w-10 animate-pulse rounded-[0.88rem] border border-[#414A34] bg-[#292928]"></span>
      <span class="h-10 w-[3.75rem] animate-pulse rounded-[0.88rem] bg-[#e58b58]/70"></span>
    </div>
  </header>

  <main class="flex flex-col gap-4">
    <section class="rounded-3xl border border-[#414A34]/20 bg-(--haven-schedule-card-bg) px-5 py-5">
      <header class="flex items-center justify-between border-b border-[#DCDACF] pb-3">
        <span class="h-6 w-16 animate-pulse rounded-full bg-[#d5d1c4]"></span>
        <span class="h-5 w-32 animate-pulse rounded-full bg-[#d5d1c4]"></span>
      </header>

      <div class="mt-5 grid gap-5">
        <div class="flex items-center gap-3">
          <span class="h-9 w-1 shrink-0 rounded-full bg-[#8872ED]/70"></span>
          <div class="grid flex-1 gap-2">
            <span class="h-5 w-[68%] animate-pulse rounded-full bg-[#d5d1c4]"></span>
            <span class="h-3 w-[42%] animate-pulse rounded-full bg-[#d5d1c4]/80"></span>
          </div>
          <span class="h-7 w-16 animate-pulse rounded-full bg-[#DDD6FF]"></span>
        </div>

        <div class="flex items-center gap-3">
          <span class="h-9 w-1 shrink-0 rounded-full bg-[#F19B27]/70"></span>
          <div class="grid flex-1 gap-2">
            <span class="h-5 w-[72%] animate-pulse rounded-full bg-[#d5d1c4]"></span>
            <span class="h-3 w-[38%] animate-pulse rounded-full bg-[#d5d1c4]/80"></span>
          </div>
          <span class="h-7 w-14 animate-pulse rounded-full bg-[#FFDBAB]"></span>
        </div>

        <div class="flex items-center gap-3">
          <span class="h-9 w-1 shrink-0 rounded-full bg-[#BAD930]/70"></span>
          <div class="grid flex-1 gap-2">
            <span class="h-5 w-[58%] animate-pulse rounded-full bg-[#d5d1c4]"></span>
            <span class="h-3 w-[32%] animate-pulse rounded-full bg-[#d5d1c4]/80"></span>
          </div>
          <span class="h-7 w-16 animate-pulse rounded-full bg-[#DCEFA2]"></span>
        </div>
      </div>
    </section>

    <section class="rounded-3xl border border-(--haven-card-border) bg-[#262625] p-4">
      <header class="grid h-7 grid-cols-[1fr_auto_1fr] items-center gap-2">
        <span class="h-6 w-20 animate-pulse rounded-full bg-[#4f5047]"></span>
        <span class="h-4 w-28 animate-pulse rounded-full bg-[#55564f]"></span>
        <span class="ml-auto h-6 w-20 animate-pulse rounded-full bg-[#4f5047]"></span>
      </header>

      <div class="mt-2 grid grid-cols-2 gap-3">
        <div class="flex h-24 items-center justify-center rounded-2xl bg-[#494940]">
          <span class="h-14 w-14 animate-pulse rounded-full bg-[#77786f]"></span>
        </div>
        <div class="flex h-24 items-center justify-center rounded-2xl bg-[#5d5e54]">
          <span class="h-14 w-14 animate-pulse rounded-full bg-[#85867d]"></span>
        </div>
      </div>
    </section>

    <section class="rounded-[1.125rem] border border-[#D8EF9E] border-l-4 bg-[#262625] p-4">
      <header class="flex items-center justify-between gap-3">
        <span class="h-5 w-28 animate-pulse rounded-full bg-[#55564f]"></span>
        <span class="h-7 w-32 animate-pulse rounded-full bg-[#414A34]"></span>
      </header>
      <div class="mt-5 grid gap-2">
        <span class="h-5 w-[92%] animate-pulse rounded-full bg-[#55564f]"></span>
        <span class="h-5 w-[68%] animate-pulse rounded-full bg-[#55564f]"></span>
      </div>
      <div class="mt-5 flex items-center justify-between">
        <span class="h-5 w-20 animate-pulse rounded-full bg-[#55564f]"></span>
        <span class="h-5 w-5 animate-pulse rounded-full bg-[#55564f]"></span>
      </div>
    </section>

    <section class="flex min-h-24 items-center gap-4 rounded-[1.125rem] border border-[#FFAE36] border-l-4 bg-[#262625] p-4">
      <span class="h-12 w-12 shrink-0 animate-pulse rounded-xl bg-[#493A22]"></span>
      <div class="grid flex-1 gap-2">
        <span class="h-5 w-36 animate-pulse rounded-full bg-[#55564f]"></span>
        <span class="h-4 w-28 animate-pulse rounded-full bg-[#55564f]"></span>
      </div>
      <span class="h-7 w-14 animate-pulse rounded-full bg-[#55564f]"></span>
    </section>
  </main>
</div>
